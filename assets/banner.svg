<svg width="1400" height="360" viewBox="0 0 1400 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070707"/>
      <stop offset="0.28" stop-color="#0E0E0E"/>
      <stop offset="0.6" stop-color="#171512"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF5DB"/>
      <stop offset="15%" stop-color="#E9D98E"/>
      <stop offset="32%" stop-color="#D4BA6B"/>
      <stop offset="52%" stop-color="#B8862D"/>
      <stop offset="72%" stop-color="#E4CC80"/>
      <stop offset="100%" stop-color="#F8E7B0"/>
    </linearGradient>

    <linearGradient id="goldSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4E7AE" stop-opacity="0.2"/>
      <stop offset="35%" stop-color="#D9BF70" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#B98A35" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F2D88B" stop-opacity="0.28"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="360" fill="url(#bg)"/>

  <g opacity="0.85">
    <circle cx="1100" cy="80" r="1.5" fill="#F8E8A8">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1210" cy="120" r="2" fill="#D7C58B">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="170" r="1.8" fill="#F8E8A8">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1240" cy="210" r="2.2" fill="#F4E7B1">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity="0.9" filter="url(#softGlow)">
    <path d="M-80 230C110 150 260 120 430 160C610 205 760 178 910 120C1080 55 1250 68 1480 130V360H-80V230Z" fill="url(#gold)" opacity="0.18">
      <animateTransform attributeName="transform" type="translate" values="0 0; 26 0; 0 0" dur="18s" repeatCount="indefinite"/>
    </path>
    <path d="M-90 278C130 200 280 220 480 260C670 296 860 300 1060 248C1170 217 1280 186 1480 210V360H-90V278Z" fill="#D7C58B" opacity="0.12">
      <animateTransform attributeName="transform" type="translate" values="0 0; -30 0; 0 0" dur="22s" repeatCount="indefinite"/>
    </path>
    <path d="M-110 305C110 240 280 255 470 285C660 315 860 318 1070 278C1175 258 1310 235 1515 260V360H-110V305Z" fill="url(#goldSoft)" opacity="0.22">
      <animateTransform attributeName="transform" type="translate" values="0 0; 18 0; 0 0" dur="15s" repeatCount="indefinite"/>
    </path>
  </g>

  <g opacity="0.78">
    <rect x="62" y="56" width="1276" height="248" rx="22" fill="rgba(17,17,17,0.82)" stroke="rgba(215,197,139,0.24)"/>
    <rect x="80" y="74" width="1240" height="212" rx="18" fill="url(#glass)"/>
  </g>

  <g>
    <text x="104" y="198" fill="#F4EFE8" font-size="58" font-family="Segoe UI, Arial, sans-serif" font-weight="800" letter-spacing="2" filter="url(#textGlow)">ADITHYAN</text>
    <text x="104" y="236" fill="url(#gold)" font-size="21" font-family="Segoe UI, Arial, sans-serif" font-weight="700" letter-spacing="1.2">DATA ANALYST &amp; SCIENTIST | MACHINE LEARNING SPECIALIST | BIG DATA | HADOOP &amp; SPARK</text>
  </g>

  <g opacity="0.9">
    <path d="M100 312H1300" stroke="url(#gold)" stroke-width="2" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0 1200; 420 780; 0 1200" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M100 314H1300" stroke="#F3D891" stroke-width="1" opacity="0.5" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0 1200; 180 1020; 0 1200" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
