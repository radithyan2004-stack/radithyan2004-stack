<svg width="1400" height="360" viewBox="0 0 1400 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0A0A"/>
      <stop offset="0.5" stop-color="#120D09"/>
      <stop offset="1" stop-color="#1A120C"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8E7B2"/>
      <stop offset="18%" stop-color="#F0C75E"/>
      <stop offset="48%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#F5D98A"/>
    </linearGradient>

    <linearGradient id="goldSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F0D98A"/>
      <stop offset="100%" stop-color="#8B6A1F"/>
    </linearGradient>

    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="360" fill="url(#bg)"/>

  <g opacity="0.9" filter="url(#glowGold)">
    <circle cx="250" cy="90" r="120" fill="#F3C55C">
      <animate attributeName="cx" values="250;1180;250" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;200;90" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="285" r="180" fill="#8B6A1F">
      <animate attributeName="cx" values="980;260;980" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="285;120;285" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1180" cy="80" r="150" fill="#D4AF37">
      <animate attributeName="cx" values="1180;1035;1180" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;220;80" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity="0.28">
    <path d="M0 280C180 240 265 205 435 220C610 236 705 315 895 300C1025 289 1158 220 1400 240V360H0V280Z" fill="#1D160F"/>
  </g>

  <rect x="56" y="52" width="1288" height="255" rx="18" fill="rgba(18,16,12,0.72)" stroke="rgba(212,175,55,0.35)"/>

  <g>
    <text x="88" y="128" fill="#F9E6A3" font-family="Georgia, serif" font-size="42" font-weight="700">Adithyan</text>
    <text x="88" y="180" fill="url(#gold)" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Data Analyst &amp; Scientist | Machine Learning Specialist | Big Data | Hadoop &amp; Spark | AI Specialist | NLP | Computer Vision Engineer</text>

    <g opacity="0.9">
      <rect x="88" y="201" width="260" height="7" rx="3.5" fill="url(#gold)"/>
      <rect x="366" y="201" width="160" height="7" rx="3.5" fill="url(#goldSoft)"/>
    </g>
  </g>

  <g opacity="0.92" transform="translate(1025 92)">
    <rect x="0" y="0" width="250" height="145" rx="18" fill="rgba(30,24,16,0.8)" stroke="rgba(212,175,55,0.3)"/>
    <circle cx="55" cy="52" r="24" fill="url(#gold)"/>
    <text x="92" y="58" fill="#F5D98A" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Status</text>
    <text x="28" y="108" fill="#F8E7B2" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Available for work</text>
  </g>

  <g opacity="0.85">
    <path d="M90 320H1310" stroke="url(#gold)" stroke-width="2" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0 1220; 430 790; 0 1220" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
