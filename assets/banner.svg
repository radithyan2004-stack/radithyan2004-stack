<svg width="1400" height="360" viewBox="0 0 1400 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090909"/>
      <stop offset="0.38" stop-color="#101010"/>
      <stop offset="1" stop-color="#171512"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F0D5"/>
      <stop offset="20%" stop-color="#EAD48A"/>
      <stop offset="45%" stop-color="#D7C58B"/>
      <stop offset="70%" stop-color="#B68C3A"/>
      <stop offset="100%" stop-color="#F0D899"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="360" fill="url(#bg)"/>

  <g opacity="0.82" filter="url(#softGlow)">
    <path d="M-90 240C120 130 330 120 520 180C710 240 840 190 980 110C1110 35 1290 50 1480 100V360H-90V240Z" fill="url(#gold)" opacity="0.16">
      <animateTransform attributeName="transform" type="translate" values="0 0; 24 0; 0 0" dur="18s" repeatCount="indefinite"/>
    </path>
    <path d="M-80 290C170 200 320 220 500 260C670 300 850 300 1060 245C1175 215 1280 185 1500 210V360H-80V290Z" fill="#D7C58B" opacity="0.10">
      <animateTransform attributeName="transform" type="translate" values="0 0; -30 0; 0 0" dur="22s" repeatCount="indefinite"/>
    </path>
  </g>

  <g opacity="0.7">
    <rect x="62" y="56" width="1276" height="248" rx="22" fill="rgba(17,17,17,0.75)" stroke="rgba(215,197,139,0.2)"/>
    <rect x="80" y="74" width="1240" height="212" rx="18" fill="url(#glass)"/>
  </g>

  <g>
    <text x="104" y="198" fill="#F4EFE8" font-size="58" font-family="Segoe UI, Arial, sans-serif" font-weight="800" letter-spacing="2">ADITHYAN</text>
    <text x="104" y="236" fill="url(#gold)" font-size="21" font-family="Segoe UI, Arial, sans-serif" font-weight="700">DATA ANALYST &amp; SCIENTIST | MACHINE LEARNING SPECIALIST | BIG DATA | HADOOP | NLP</text>
  </g>

  <g opacity="0.9">
    <path d="M100 312H1300" stroke="url(#gold)" stroke-width="2" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0 1200; 420 780; 0 1200" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
