<svg width="1400" height="360" viewBox="0 0 1400 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090909"/>
      <stop offset="0.5" stop-color="#111111"/>
      <stop offset="1" stop-color="#1b1a17"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5E9B6"/>
      <stop offset="25%" stop-color="#E6C86E"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#B68A1C"/>
      <stop offset="100%" stop-color="#F3D98A"/>
    </linearGradient>

    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="50%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#6B7280"/>
    </linearGradient>

    <filter id="blurGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="360" fill="url(#bg)"/>

  <g opacity="0.92" filter="url(#blurGlow)">
    <circle cx="210" cy="95" r="110" fill="#C9A24E">
      <animate attributeName="cx" values="210;1180;210" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="95;175;95" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="282" r="180" fill="#6B7280">
      <animate attributeName="cx" values="980;260;980" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="282;120;282" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1185" cy="90" r="145" fill="#D4AF37">
      <animate attributeName="cx" values="1185;1030;1185" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;220;90" dur="13s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity="0.26">
    <path d="M0 285C180 252 245 208 400 220C560 232 640 304 790 300C960 296 1095 220 1400 245V360H0V285Z" fill="#171512"/>
  </g>

  <rect x="52" y="52" width="1296" height="255" rx="22" fill="rgba(17,17,17,0.72)" stroke="rgba(212,175,55,0.28)"/>

  <g>
    <text x="90" y="110" fill="#F4EFE8" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="700" letter-spacing="6">ADITHYAN</text>
    <text x="90" y="165" fill="#F4EFE8" font-size="56" font-family="Segoe UI, Arial, sans-serif" font-weight="800" letter-spacing="2">ADITHYAN</text>
    <text x="90" y="205" fill="url(#gold)" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Data Analyst &amp; Scientist | Machine Learning Specialist | Big Data | Hadoop &amp; Spark | AI Specialist | NLP | Computer Vision Engineer</text>
  </g>

  <g transform="translate(1020 85)">
    <rect x="0" y="0" width="270" height="120" rx="18" fill="rgba(20,20,20,0.82)" stroke="rgba(156,163,175,0.2)"/>
    <circle cx="34" cy="32" r="10" fill="url(#steel)"/>
    <text x="58" y="38" fill="#E5E7EB" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Status</text>
    <text x="30" y="84" fill="#F4EFE8" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Available for work</text>
  </g>

  <g opacity="0.9">
    <path d="M90 322H1310" stroke="url(#gold)" stroke-width="2" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0 1220; 450 770; 0 1220" dur="4.5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
