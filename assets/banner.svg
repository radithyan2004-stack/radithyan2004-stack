<svg width="1400" height="360" viewBox="0 0 1400 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0A0A"/>
      <stop offset="0.5" stop-color="#12100C"/>
      <stop offset="1" stop-color="#1A140D"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8E7B2"/>
      <stop offset="20%" stop-color="#F0C75E"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#F5D98A"/>
    </linearGradient>

    <linearGradient id="goldSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E6C76C"/>
      <stop offset="100%" stop-color="#8B6A1F"/>
    </linearGradient>

    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="360" fill="url(#bg)"/>

  <g opacity="0.95">
    <rect x="0" y="0" width="1400" height="360" fill="url(#bg)"/>
  </g>

  <g opacity="0.35" filter="url(#glowGold)">
    <circle cx="1180" cy="90" r="130" fill="#D4AF37"/>
    <circle cx="950" cy="290" r="180" fill="#8B6A1F"/>
    <circle cx="260" cy="100" r="115" fill="#E8C86A"/>
  </g>

  <g opacity="0.3">
    <path d="M0 270C180 240 260 200 430 220C610 240 689 310 860 300C998 292 1110 220 1400 238V360H0V270Z" fill="#201A12"/>
  </g>

  <rect x="56" y="52" width="1288" height="255" rx="18" fill="rgba(18,16,12,0.7)" stroke="rgba(212,175,55,0.35)"/>

  <g>
    <text x="88" y="128" fill="#F9E6A3" font-family="Georgia, serif" font-size="42" font-weight="700">Radithyan</text>
    <text x="88" y="176" fill="url(#gold)" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">Full Stack Developer • Designer • Builder</text>

    <g opacity="0.9">
      <rect x="88" y="199" width="220" height="7" rx="3.5" fill="url(#gold)"/>
      <rect x="322" y="199" width="160" height="7" rx="3.5" fill="url(#goldSoft)"/>
    </g>

    <g fill="#F2E7C8" font-family="Consolas, monospace" font-size="18">
      <text x="88" y="246">const skillset = ["React", "Node.js", "TypeScript", "Python"];</text>
      <text x="88" y="278">const craft = "designing premium digital experiences";</text>
    </g>
  </g>

  <g opacity="0.92" transform="translate(1025 95)">
    <rect x="0" y="0" width="245" height="145" rx="16" fill="rgba(30,24,16,0.8)" stroke="rgba(212,175,55,0.3)"/>
    <circle cx="55" cy="52" r="24" fill="url(#gold)"/>
    <text x="92" y="58" fill="#F5D98A" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Status</text>
    <text x="30" y="108" fill="#F8E7B2" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Available for work</text>
  </g>

  <g opacity="0.85">
    <path d="M90 320H1310" stroke="url(#gold)" stroke-width="2" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0 1220; 420 800; 0 1220" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
